# BUILDS ALL PICO AND MEGA FIRMWARE VARIANTS IN DOCKER (ci/Dockerfile)
# ARTIFACT: dbclock-firmware-<commit>, TAGS v* ALSO CREATE A GITHUB RELEASE WITH THE FILES
name: firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ONLY USED BY THE RELEASE STEP
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware in Docker
        run: sh ci/docker_build.sh "${GITHUB_REF_NAME}@${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v4
        with:
          name: dbclock-firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "DBClock $GITHUB_REF_NAME" --generate-notes
