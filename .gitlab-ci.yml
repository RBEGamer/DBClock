# BUILDS ALL PICO AND MEGA FIRMWARE VARIANTS IN DOCKER (ci/Dockerfile), DOCKER-IN-DOCKER NEEDS A PRIVILEGED RUNNER
# (THE SHARED RUNNERS ON GITLAB.COM ARE). ARTIFACT: dbclock-firmware-<commit>
firmware:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - sh ci/docker_build.sh "$CI_COMMIT_REF_NAME@$CI_COMMIT_SHORT_SHA"
  artifacts:
    name: "dbclock-firmware-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
