; DBCLOCK MAIN CONTROLLER: ARDUINO MEGA 2560
; DRIVES THE BU 190t CLOCK DRIVE, DS1307/DS3231 RTC, LED STRIP
; BUILD: pio run    UPLOAD: pio run -t upload

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
; RTClib AND Adafruit_BusIO ARE VENDORED IN lib/
