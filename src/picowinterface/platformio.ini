; DBCLOCK NETWORK INTERFACE: RASPBERRY PI PICO (W) + WIZNET ETHERNET HAT (W5100S)
; USES THE ARDUINO-PICO CORE (https://github.com/earlephilhower/arduino-pico)
; BUILD: pio run    UPLOAD: pio run -t upload (OR COPY .pio/build/<env>/firmware.uf2 TO THE RPI-RP2 / RP2350 DRIVE)
;
; rpipicow  : PICO W AND PICO (RP2040), THE WIFI CHIP IS DETECTED AT BOOT
; rpipico2w : PICO 2 W (RP2350)
; rpipico2  : PICO 2 (RP2350) WITHOUT WIFI, LAN ONLY

[platformio]
default_envs = rpipicow

[common]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
; FS IS NEEDED FOR THE SETTINGS AND FOR OTA UPDATES
board_build.filesystem_size = 1m
monitor_speed = 115200
; NTPClient IS VENDORED IN lib/, ALL OTHER LIBRARIES ARE PART OF THE ARDUINO-PICO CORE

[env:rpipicow]
platform = ${common.platform}
framework = ${common.framework}
board_build.core = ${common.board_build.core}
board_build.filesystem_size = ${common.board_build.filesystem_size}
monitor_speed = ${common.monitor_speed}
board = rpipicow

[env:rpipico2w]
platform = ${common.platform}
framework = ${common.framework}
board_build.core = ${common.board_build.core}
board_build.filesystem_size = ${common.board_build.filesystem_size}
monitor_speed = ${common.monitor_speed}
board = rpipico2w

[env:rpipico2]
platform = ${common.platform}
framework = ${common.framework}
board_build.core = ${common.board_build.core}
board_build.filesystem_size = ${common.board_build.filesystem_size}
monitor_speed = ${common.monitor_speed}
board = rpipico2
