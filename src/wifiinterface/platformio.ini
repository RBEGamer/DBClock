; DBCLOCK WIFI INTERFACE: ESP8266
; BUILD: pio run    UPLOAD: pio run -t upload    OTA: pio run -t upload --upload-port dbclock<chipid>.local

[platformio]
default_envs = nodemcu

[common]
platform = espressif8266
framework = arduino
monitor_speed = 9600
; NTPClient, Time AND WiFiManager ARE VENDORED IN lib/

[env:nodemcu]
platform = ${common.platform}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board = nodemcu
board_build.ldscript = eagle.flash.4m1m.ld

[env:esp01_1m]
platform = ${common.platform}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board = esp01_1m
board_build.ldscript = eagle.flash.1m256.ld
